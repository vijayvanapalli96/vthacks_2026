bundle:
  name: vthacks-career-app

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "vthacks-career-app"
      description: "Accessible job application intelligence dashboard"
      source_code_path: ./

      config:
        command: ['npm', 'run', 'start']
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          # Auth.js refuses to run in production without a signing secret. It lives
          # in secret scope `hirewire`, never in git.
          - name: AUTH_SECRET
            value_from: auth-secret
          # Databricks Apps terminates TLS in front of us; without the public origin
          # Auth.js calls https://<internal-host>:8000 and hits a plain-HTTP port.
          - name: AUTH_URL
            value: https://vthacks-career-app-7474648702108753.aws.databricksapps.com
          - name: AUTH_TRUST_HOST
            value: "true"
          # ANS identity keys sign outbound A2A envelopes (src/lib/ans/envelope.ts).
          # Receivers check the cert against the fingerprint ANS attests.
          - name: APPLICANT_IDENTITY_KEY
            value_from: applicant-identity-key
          - name: APPLICANT_IDENTITY_CERT
            value_from: applicant-identity-cert
          - name: EMPLOYER_IDENTITY_KEY
            value_from: employer-identity-key
          - name: EMPLOYER_IDENTITY_CERT
            value_from: employer-identity-cert

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, dashboards.genie, files.files, serving.serving-endpoints
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: auth-secret
          secret:
            scope: hirewire
            key: auth-secret
            permission: READ
        - name: applicant-identity-key
          secret:
            scope: hirewire
            key: applicant-identity-key
            permission: READ
        - name: applicant-identity-cert
          secret:
            scope: hirewire
            key: applicant-identity-cert
            permission: READ
        - name: employer-identity-key
          secret:
            scope: hirewire
            key: employer-identity-key
            permission: READ
        - name: employer-identity-cert
          secret:
            scope: hirewire
            key: employer-identity-cert
            permission: READ

targets:
  default:
    default: true
    workspace:
      host: https://dbc-0bfd7b56-c2eb.cloud.databricks.com

    variables:
      sql_warehouse_id: 441b670a0ff475e0
