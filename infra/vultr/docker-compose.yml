services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app.env
    restart: unless-stopped

  employer:
    build:
      context: ./agents
      dockerfile: employer/Dockerfile
    environment:
      EMPLOYER_ANS_NAME: ans://v1.0.0.employer.hirewire.biz
      EMPLOYER_ENDPOINT_URL: https://employer.hirewire.biz/a2a/apply
      PORT: "8787"
    restart: unless-stopped

  applicant:
    build:
      context: ./agents
      dockerfile: applicant/Dockerfile
    environment:
      PORT: "8788"
    restart: unless-stopped

  # Playwright ATS worker. Note what is absent: no `ports:` block and no vhost in
  # the Caddyfile. It is reachable only from the other services on this network.
  # Driving a headless browser at a caller-supplied URL is an open proxy if you
  # expose it, and it would let a stranger borrow the hirewire.biz identity.
  ats:
    # Opt-in. `docker compose up -d` brings up employer, applicant and caddy
    # exactly as it did before this service existed; the worker starts only
    # under `--profile ats`. The demo path must not be able to fail because a
    # Chromium image would not build.
    profiles: ["ats"]
    build:
      context: ./agents
      dockerfile: ats/Dockerfile
    environment:
      ATS_WORKER_PORT: "8789"
      APPLICANT_ANS_NAME: ans://v1.0.0.applicant.hirewire.biz
      ATS_ARTIFACT_DIR: /app/work/ats
      AUDIT_LOG_PATH: /app/audit/events.jsonl
      # Required. Unset, the worker rejects every request.
      ATS_WORKER_TOKEN: ${ATS_WORKER_TOKEN:-}
      # The kill switch. Leave this false to deploy a box that physically cannot
      # send an application, only prepare one for review.
      ATS_ALLOW_SUBMIT: ${ATS_ALLOW_SUBMIT:-false}
    volumes:
      - ats_work:/app/work/ats
      - ats_audit:/app/audit
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - app
      - employer
      - applicant
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  ats_work:
  ats_audit:
